name: Verify game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:solar
      - run: npm run build
